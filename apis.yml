aid: nomagic
name: Nomagic
description: Nomagic builds Physical AI for end-to-end warehouse automation, using AI-powered
  robotic arms and computer vision to automate picking, packing, sorting and other fulfillment
  tasks across e-commerce, fashion, pharmaceutical and third-party logistics warehouses.
  Nomagic exposes a standard Station API for systems integrators, WCS/WMS providers and
  customers to control its robots, and a Grip AI API that adds an intelligence layer to
  third-party robot hardware; all robot actions are recorded to the Nomagic Cloud to
  continually improve its models. The company is backed by Khosla Ventures. Public
  developer documentation for these APIs is not published; integration is arranged
  directly with Nomagic.
